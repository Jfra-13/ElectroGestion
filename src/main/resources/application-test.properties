# Perfil de Test - H2 en Memoria (efímero, sin fugas de estado entre runs)
# Flyway desactivado: los tests usan JPA create-drop sobre H2.
# La verificación de las migraciones Flyway corre contra PostgreSQL real
# (Testcontainers) en MigracionesFlywayIntegrationTest.
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# CORS Test
cors.allowed-origins=http://localhost:3000

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-entidades.sql
spring.jpa.defer-datasource-initialization=true
