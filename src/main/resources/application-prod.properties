# Perfil de Producción - PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electrogenos_prod}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Migraciones de esquema (Flyway crea/evoluciona; JPA solo valida)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Bootstrap del primer administrador (sin defaults en credenciales -> fail-fast)
app.bootstrap.admin.username=${ADMIN_USERNAME}
app.bootstrap.admin.password=${ADMIN_PASSWORD}
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@electrogenos.local}

# JWT Production Security
jwt.secret=${JWT_SECRET_PROD}
jwt.expiration=3600000

# CORS Production
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
