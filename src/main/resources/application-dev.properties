# Perfil de Desarrollo - H2 en Memoria
# Flyway desactivado: dev usa JPA (ddl-auto=update) sobre H2.
# Las migraciones Flyway son específicas de PostgreSQL (perfil prod).
spring.flyway.enabled=false
spring.datasource.url=jdbc:h2:mem:grupos_electrogenos_dev;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ingesta de datos de ejemplo: recarga data-dev.sql en cada arranque dev (H2 efímera).
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.jpa.defer-datasource-initialization=true

# CORS Development
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:4321
