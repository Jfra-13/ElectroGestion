# Perfil de Desarrollo - H2 en Memoria
spring.datasource.url=jdbc:h2:mem:grupos_electrogenos_dev;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-entidades.sql
spring.jpa.defer-datasource-initialization=true

# CORS Development
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:4321
